name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: Lint (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run ShellCheck on every .sh file
        run: |
          shellcheck --version
          find . -type f -name '*.sh' -print0 | xargs -0 -r shellcheck

  smoke-test:
    name: Smoke test (Debian 12)
    runs-on: ubuntu-latest
    container:
      image: debian:12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends procps

      - name: Run server-stats.sh
        run: bash ./01-server-stats/server-stats.sh
